<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form | WDD 131</title>
    <meta name="author" content="Ethan Bayer">
    <meta name="description"
        content="Wdd131 week 5 assginment. This page uses javascript and and html to create a product review site that uses good form practices.">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&display=swap" rel="stylesheet">
    <script defer src="scripts/form.js"></script>
    <script defer src="scripts/getdates.js"></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html" class="wf1">
            <label for="products">Product Name*<select id="products" name="products" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select></label>

            <div>Overall Rating*</div>
            <label for="fiveStars"><input type="radio" name="rating" value="fiveStars" id="fiveStars"
                    required>&star;&star;&star;&star;&star;</label>
            <label for="fourStars"><input type="radio" name="rating" value="fourStars" id="fourStars"
                    required>&star;&star;&star;&star;</label>
            <label for="threeStars"><input type="radio" name="rating" value="threeStars" id="threeStars"
                    required>&star;&star;&star;</label>
            <label for="twoStars"><input type="radio" name="rating" value="twoStars" id="twoStars"
                    required>&star;&star;</label>
            <label for="oneStar"><input type="radio" name="rating" value="oneStar" id="oneStar" required>&star;</label>





            <label for="date">Date of Installation*<input type="date" id="date" name="date" required></label>

            <div>Which features did you find useful in the product? &nbsp;(Check all that apply)</div>
            <label for="durability"><input type="checkbox" id="durability" name="durability"
                    value="durability">Durability</label>
            <label for="usability"><input type="checkbox" id="usability" name="usability" value="usability">Ease of
                Use</label>
            <label for="preformance"><input type="checkbox" id="preformance" name="preformance"
                    value="preformance">Preformance</label>
            <label for="design"><input type="checkbox" id="design" name="design" value="design">Design</label>

            <label for="written">Written Review<textarea id="written" name="written"></textarea></label>
            <label for="username">Your Name<input type="text" id="username" name="username"></label>
            <input type="submit" value="Send My Review">
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentYear"> | Ethan Bayer | Illinois</span></p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
